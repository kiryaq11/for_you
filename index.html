<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Для тебя ♥ — букет роз</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060309;
      --pink: #ff87b7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; min-height: 100vh;
      background: var(--bg);
      color: #fff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    body { display: flex; align-items: center; justify-content: center; }

    #stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3vh;
      padding: 14px 8px;
    }

    /* ---------- ASCII-букет роз ---------- */
    #art {
      font-family: "JetBrains Mono", "Courier New", Courier, monospace;
      font-weight: 700;
      font-size: clamp(7px, 2.25vw, 13px);
      line-height: 1.0;
      letter-spacing: 0;
      display: grid;
      grid-template-columns: repeat(56, 1ch);
      filter: drop-shadow(0 0 22px rgba(255, 110, 165, 0.16));
    }
    #art span { display: inline-block; opacity: 0; }
    #art.run span {
      animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 glim 4.2s ease-in-out infinite;
    }
    #art.run span.one {
      animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    #art.run span.sp { animation: none; opacity: 1; }
    @keyframes pop {
      0%   { opacity: 0; transform: scale(0.3); }
      70%  { opacity: 1; transform: scale(1.18); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes glim {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.5; }
    }

    /* ---------- подпись и сердечко ---------- */
    .caption {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1.4s ease, transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .caption.show { opacity: 1; transform: translateY(0); }
    .caption-text {
      font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
      font-size: clamp(28px, 7vw, 52px);
      letter-spacing: 0.06em;
      color: #fff;
      text-shadow: 0 0 18px rgba(255, 135, 183, 0.45), 0 0 44px rgba(255, 135, 183, 0.25);
    }
    .heart {
      font-size: clamp(42px, 10vw, 78px);
      line-height: 1;
      color: var(--pink);
      text-shadow: 0 0 22px rgba(255, 110, 165, 0.75), 0 0 60px rgba(255, 110, 165, 0.4);
      animation: heartPulse 1.6s ease-in-out infinite;
    }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      12%      { transform: scale(1.22); }
      24%      { transform: scale(1); }
      36%      { transform: scale(1.14); }
      50%      { transform: scale(1); }
    }

    /* ---------- падающие лепестки-символы ---------- */
    .fall {
      position: fixed;
      font-family: "JetBrains Mono", monospace;
      font-weight: 700;
      color: #f3a3c9;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    /* ---------- искорки ---------- */
    .spk {
      position: fixed;
      font-family: "JetBrains Mono", monospace;
      color: #ffd7e8;
      pointer-events: none;
      opacity: 0;
      animation: twinkle 3s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.05; }
      50%      { opacity: 0.8; }
    }

    /* ---------- стартовый оверлей ---------- */
    .tap-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      cursor: pointer;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }
    .tap-overlay.dismissed { opacity: 0; visibility: hidden; pointer-events: none; }
    .tap-accent {
      font-size: 30px; color: #ffd7e8;
      text-shadow: 0 0 24px rgba(255, 135, 183, 0.8);
      animation: floatSparkle 2.8s ease-in-out infinite;
    }
    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.85; }
      50%      { transform: translateY(-6px) scale(1.08); opacity: 1; }
    }
    .tap-prompt {
      margin: 0;
      font-size: clamp(24px, 4.5vw, 38px);
      font-weight: 500;
      color: #fff;
      animation: pulsePrompt 2.4s ease-in-out infinite;
    }
    @keyframes pulsePrompt {
      0%, 100% { opacity: 0.7; letter-spacing: 0.04em; }
      50%      { opacity: 1; letter-spacing: 0.08em; }
    }

    /* ---------- кнопка мелодии ---------- */
    #musicBtn {
      position: fixed; top: 14px; right: 14px; z-index: 50;
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid rgba(255, 135, 183, 0.35);
      background: rgba(255, 135, 183, 0.08);
      color: #ffb9d4; font-size: 19px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease, background 0.25s ease, transform 0.15s ease;
      cursor: pointer;
    }
    #musicBtn.on { opacity: 1; pointer-events: auto; }
    #musicBtn:hover { background: rgba(255, 135, 183, 0.18); }
    #musicBtn:active { transform: scale(0.92); }
  </style>
</head>
<body>
  <div id="stage">
    <div id="art" aria-hidden="true"></div>
    <div class="caption" id="caption" aria-hidden="true">
      <div class="caption-text">Для тебя</div>
      <div class="heart">♥</div>
    </div>
  </div>

  <button id="musicBtn" title="Играть мелодию ещё раз" aria-label="Играть мелодию ещё раз">♪</button>

  <div class="tap-overlay" id="tapOverlay">
    <div class="tap-accent">❀</div>
    <p class="tap-prompt">Нажми на экран</p>
  </div>

  <script>
  (function () {
    "use strict";

    /* ================= палитра символов =================
       @ # O o ~ . — лепестки роз (тёмный розовый → блик)
       ; | / \ , ^ — стебли и листья (зелёные оттенки)
       : = -       — кремовая обёртка
       *           — розовая лента
    */
    var COL = {
      '@': '#b03a68', '#': '#d16392', 'O': '#f0a3c8', 'o': '#f7c4da',
      '~': '#fbe3ef', '.': '#fff4f9',
      ';': '#3d6b3d', '|': '#588a4e', '/': '#588a4e', '\\': '#3d6b3d',
      ',': '#7fae70', '^': '#9cc98b',
      ':': '#f4ebd9', '=': '#e8d9c1', '-': '#d6c2a6',
      '*': '#ef9cc4'
    };
    var PETAL = { '@': 1, '#': 1, 'O': 1, 'o': 1, '~': 1, '.': 1 };

    var W = 56, H = 50;

    /* ================= шаблоны роз (ручная символьная графика) ================= */
    var ROSE_BIG = [
      "               .~=o~.",
      "          .~=oO########Oo~.",
      "        ~oO########@@########Oo~",
      "      ~oO########@  .~o~.  @########Oo~",
      "     oO########@   oO#O#o   @########Oo",
      "     O########@   oO#@O@o   @########O",
      "    ~O########@##oO#@O@Oo##@########O~",
      "    O########@###oO#@O#o###@########O",
      "   ~O########@####oO#@O@Oo####@########O~",
      "   O########@#####oO#@O#o#####@########O",
      "   O########@####oO#@O@Oo####@########O",
      "   ~O########@###oO#@O#o###@########O~",
      "    O########@##oO#@O@Oo##@########O",
      "    ~O########@##oO#@O#o##@########O~",
      "     O########@   oO#@O@o   @########O",
      "     oO########@   oO#O#o   @########Oo",
      "      ~oO########@  .~o~.  @########Oo~",
      "        ~oO########@@########Oo~",
      "          .~=oO########Oo~.",
      "               .~=o~."
    ];
    var ROSE_MED = [
      "          .~=o~.",
      "      .~=oO######Oo~.",
      "    ~oO##########Oo~",
      "   oO#####@ .~o~. @#####Oo",
      "  ~O#####@ oO#O#o @#####O~",
      "  O#####@ oO#@O@o @#####O",
      " O#####@#oO#@O#o@#####@O",
      " O#####@oO#@O@Oo@#####@O",
      " O#####@#oO#@O#o@#####@O",
      "  ~O#####@ oO#@O@o @#####O~",
      "   oO#####@ .~o~. @#####Oo",
      "    ~oO##########Oo~",
      "      .~=oO######Oo~.",
      "          .~=o~."
    ];
    var ROSE_BUD = [
      "    .~o~.",
      "  .oO#O#o.",
      " oO@##@@Oo",
      "O@##@@##@O",
      "O@#@@@@#@O",
      "O@#@@@@#@O",
      "O@##@@##@O",
      " oO@##@@Oo",
      "  .oO#O#o.",
      "    .~o~."
    ];

    /* ================= сетка ================= */
    var grid = [];
    for (var y = 0; y < H; y++) { grid.push(new Array(W).fill(' ')); }

    function put(x, y, ch, overwrite) {
      x = Math.round(x); y = Math.round(y);
      if (x < 0 || x >= W || y < 0 || y >= H) return;
      if (overwrite || grid[y][x] === ' ') grid[y][x] = ch;
    }

    /* поставить шаблон: (ox,oy) — верхний левый угол */
    function stamp(t, ox, oy) {
      for (var y = 0; y < t.length; y++) {
        for (var x = 0; x < t[y].length; x++) {
          var ch = t[y][x];
          if (ch !== ' ') put(ox + x, oy + y, ch, true);
        }
      }
    }

    /* ================= стебель и лист ================= */
    function stem(x0, y0, x1, y1, bow) {
      var steps = 30, prev = null;
      var mx = (x0 + x1) / 2 + bow, my = (y0 + y1) / 2 + 4;
      for (var i = 0; i <= steps; i++) {
        var f = i / steps, u = 1 - f;
        var x = u * u * x0 + 2 * u * f * mx + f * f * x1;
        var y = u * u * y0 + 2 * u * f * my + f * f * y1;
        var gx = Math.round(x), gy = Math.round(y);
        if (prev && (prev.x !== gx || prev.y !== gy)) {
          var dx = gx - prev.x;
          var ch = dx > 0 ? '/' : (dx < 0 ? '\\' : '|');
          put(gx, gy, ch, false);
        }
        prev = { x: gx, y: gy };
      }
    }

    function leaf(x, y, left) {
      var s = left ? -1 : 1;
      put(x + 2 * s, y - 1, ',', false);
      put(x + 3 * s, y - 1, '^', false);
      put(x + 1 * s, y, ',', false);
      put(x + 2 * s, y, '|', false);
      put(x + 3 * s, y, '^', false);
      put(x + 2 * s, y + 1, '^', false);
    }

    /* ================= обёртка (бумага с V-верхом и уголками) ================= */
    function wrap() {
      var cx = 28, topC = 30, topEdge = 28, bot = 46;
      var hwTop = 14, hwBot = 17, slope = (topC - topEdge) / hwTop;
      for (var y = topEdge; y <= bot; y++) {
        var f = (y - topEdge) / (bot - topEdge);
        var hw = hwTop + (hwBot - hwTop) * f;
        for (var x = Math.round(cx - hw); x <= Math.round(cx + hw); x++) {
          var vx = Math.abs(x - cx);
          if (vx > hw) continue;
          var topY = topC - vx * slope;      // центр ниже, уголки выше
          if (y < topY) continue;
          var ch;
          if (vx <= 3) ch = ':';
          else if (vx <= hw * 0.62) ch = Math.random() < 0.75 ? ':' : '=';
          else ch = Math.random() < 0.5 ? '=' : '-';
          if (vx === 6 || vx === 12) ch = '-';   // складки бумаги
          if (y === bot) ch = '-';
          put(x, y, ch, false);
        }
      }
    }

    /* ================= лента и бант ================= */
    function ribbon() {
      var cx = 28;
      for (var y = 37; y <= 38; y++) {
        var f = (y - 28) / (46 - 28);
        var hw = 14 + 3 * f - (y === 38 ? 0.6 : 0);
        for (var x = Math.round(cx - hw); x <= Math.round(cx + hw); x++) {
          grid[y][x] = Math.random() < 0.6 ? '*' : '#';
        }
      }
      var bow = [
        [26, 36, '*'], [27, 36, '*'], [29, 36, '*'], [30, 36, '*'], [25, 36, '*'], [31, 36, '*'],
        [24, 37, '*'], [32, 37, '*'], [25, 38, '*'], [31, 38, '*'],
        [27, 37, 'o'], [28, 37, 'o'],
        [26, 39, '*'], [27, 40, '*'], [30, 39, '*'], [29, 40, '*']
      ];
      bow.forEach(function (p) { put(p[0], p[1], p[2], true); });
    }

    /* ================= композиция (сзади наперёд) ================= */
    stamp(ROSE_BUD, 3, 2);     // бутон, левый угол
    stamp(ROSE_BUD, 49, 2);    // бутон, правый угол
    stamp(ROSE_MED, 4, 6);     // левая роза
    stamp(ROSE_MED, 30, 6);    // правая роза
    stamp(ROSE_BIG, 11, 1);    // большая центральная роза

    stem(15, 19, 28, 29, -3);
    stem(28, 21, 28, 29, 0);
    stem(41, 19, 28, 29, 3);

    leaf(21, 25, true);
    leaf(35, 25, false);
    leaf(17, 28, true);
    leaf(39, 28, false);

    wrap();
    ribbon();

    /* ================= отрисовка сетки ================= */
    var art = document.getElementById('art');
    var html = '';
    for (var ry = 0; ry < H; ry++) {
      for (var rx = 0; rx < W; rx++) {
        var ch = grid[ry][rx];
        if (ch === ' ') { html += '<span class="sp">\u00a0</span>'; continue; }
        var d = 0.15 + Math.sqrt(Math.pow(rx - 28, 2) + Math.pow((ry - 15) * 1.1, 2)) * 0.045 + Math.random() * 0.1;
        var glim = PETAL[ch] && Math.random() < 0.33;
        var style = 'color:' + COL[ch] + ';animation-delay:' + d.toFixed(2) + 's' +
                    (glim ? ',' + (d + 1.2 + Math.random() * 2.5).toFixed(2) + 's' : '');
        html += '<span' + (glim ? '' : ' class="one"') + ' style="' + style + '">' + ch + '</span>';
      }
    }
    art.innerHTML = html;

    /* ================= искорки ================= */
    for (var s = 0; s < 16; s++) {
      var el = document.createElement('span');
      el.className = 'spk';
      el.textContent = Math.random() < 0.5 ? '.' : '+';
      el.style.left = (5 + Math.random() * 90) + '%';
      el.style.top = (3 + Math.random() * 90) + '%';
      el.style.fontSize = (9 + Math.random() * 8) + 'px';
      el.style.animationDelay = (Math.random() * 3) + 's';
      el.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
      document.body.appendChild(el);
    }

    /* ================= падающие лепестки-символы ================= */
    var fallChars = ['*', '~', 'o', '.'];
    var falls = [];
    for (var q = 0; q < 12; q++) {
      var el = document.createElement('span');
      el.className = 'fall';
      el.textContent = fallChars[q % fallChars.length];
      el.style.fontSize = (10 + Math.random() * 8) + 'px';
      document.body.appendChild(el);
      falls.push({
        el: el,
        x: Math.random() * 100,
        y: -10 - Math.random() * 60,
        vy: 2 + Math.random() * 3,
        ph: Math.random() * 6.28,
        rot: Math.random() * 360,
        vr: (Math.random() - 0.5) * 40
      });
    }
    var lastT = 0;
    function fallFrame(now) {
      var t = now / 1000;
      var dt = Math.min(0.05, t - lastT || 0.016);
      lastT = t;
      if (t > 1.2) {
        for (var i = 0; i < falls.length; i++) {
          var p = falls[i];
          p.y += p.vy * dt * 8;
          p.x += Math.sin(t * 0.9 + p.ph) * dt * 3;
          p.rot += p.vr * dt;
          if (p.y > 108) { p.y = -8 - Math.random() * 30; p.x = Math.random() * 100; }
          p.el.style.opacity = '0.75';
          p.el.style.left = p.x + 'vw';
          p.el.style.top = p.y + 'vh';
          p.el.style.transform = 'rotate(' + p.rot + 'deg)';
        }
      }
      requestAnimationFrame(fallFrame);
    }
    requestAnimationFrame(fallFrame);

    /* ================= музыка (Web Audio, без файлов) ================= */
    var actx = null, masterGain = null;
    function ensureAudio() {
      if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      var filt = actx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 4200;
      masterGain = actx.createGain();
      masterGain.gain.value = 0.9;
      filt.connect(masterGain);
      masterGain.connect(actx.destination);
    }
    function playMusicBoxNote(freq, when, dur) {
      if (!actx) return;
      var t0n = actx.currentTime + when;
      var partials = [[1, 0.16], [2.0, 0.045], [4.2, 0.012]];
      for (var i = 0; i < partials.length; i++) {
        var o = actx.createOscillator();
        o.type = 'sine';
        o.frequency.value = freq * partials[i][0];
        o.detune.value = (Math.random() - 0.5) * 5;
        var g = actx.createGain();
        g.gain.setValueAtTime(0.0001, t0n);
        g.gain.exponentialRampToValueAtTime(partials[i][1], t0n + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0n + dur);
        o.connect(g); g.connect(masterGain);
        o.start(t0n); o.stop(t0n + dur + 0.1);
      }
    }
    var MELODY = [523.25, 659.25, 783.99, 1046.5, 987.77, 783.99, 659.25, 783.99,
                  880.00, 739.99, 587.33, 739.99, 659.25, 523.25, 783.99, 523.25];
    function playMelody() {
      ensureAudio();
      if (!actx) return;
      var step = 0.30;
      for (var i = 0; i < MELODY.length; i++) playMusicBoxNote(MELODY[i], i * step, 1.7);
    }

    /* ================= запуск ================= */
    var started = false;
    var overlay = document.getElementById('tapOverlay');
    var caption = document.getElementById('caption');
    var musicBtn = document.getElementById('musicBtn');

    function start() {
      if (started) return;
      started = true;
      overlay.classList.add('dismissed');
      musicBtn.classList.add('on');
      playMelody();
      var begin = function () {
        art.classList.add('run');
        setTimeout(function () { caption.classList.add('show'); }, 2300);
      };
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(begin);
      else begin();
    }
    overlay.addEventListener('pointerdown', start, { once: true });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') start();
    }, { once: true });
    musicBtn.addEventListener('click', function (e) { e.stopPropagation(); playMelody(); });
  })();
  </script>
</body>
</html>
